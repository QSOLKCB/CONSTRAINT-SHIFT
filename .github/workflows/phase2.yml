name: Phase 2 Language Harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: false
      - name: Install fixed Rust release
        run: rustup toolchain install 1.85.0 --profile minimal && rustup default 1.85.0
      - name: Select GCC 13 tools
        run: |
          mkdir -p "$RUNNER_TEMP/phase2-tools"
          ln -s /usr/bin/gcc-13 "$RUNNER_TEMP/phase2-tools/gcc"
          ln -s /usr/bin/g++-13 "$RUNNER_TEMP/phase2-tools/g++"
          echo "$RUNNER_TEMP/phase2-tools" >> "$GITHUB_PATH"
      - name: Run harness regressions
        run: python3 -m unittest discover -s tests -p "test_phase2*.py" -v
      - name: Execute all five reference adapters
        run: python3 scripts/language_harness.py run --languages c cpp rust go python --timeout 60 --output evidence/phase2-ci
      - name: Verify retained records and physical evidence
        if: always()
        run: python3 scripts/language_harness.py verify evidence/phase2-ci
      - name: Retain execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-language-harness-${{ github.sha }}
          path: evidence/phase2-ci/
          if-no-files-found: error
          retention-days: 30
