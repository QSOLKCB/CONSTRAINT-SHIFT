name: Phase 0 Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install pinned validator dependencies
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: Validate research contract
        run: python3 scripts/validate_phase0.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
